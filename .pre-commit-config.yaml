# Written by /fwd:setup-precommit. A re-run rewrites this file; delete this line to keep your own edits.
# After a clone, `pre-commit install` installs all three hooks: commit, commit
# message and push.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# default_stages covers only hooks whose own definition names no stages; the
# ones that list pre-push get stages: [pre-commit] here, or they run on push too.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '(^|/)(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lock|uv\.lock|poetry\.lock|Pipfile\.lock|Cargo\.lock|composer\.lock|vendor/.*|.*\.min\.(js|css))$'
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: '(^|/)(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lock|uv\.lock|poetry\.lock|Pipfile\.lock|Cargo\.lock|composer\.lock|vendor/.*|.*\.min\.(js|css))$'
        stages: [pre-commit]
      - id: check-merge-conflict
      - id: check-added-large-files
        stages: [pre-commit]
      - id: detect-private-key
      # Syntax only: custom tags (!Ref, !!python) and multi-document files pass.
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      # tsconfig and editor settings are JSON with comments.
      - id: check-json
        exclude: '(^|/)(tsconfig[^/]*|jsconfig[^/]*)\.json$|(^|/)\.(vscode|devcontainer)/'
      - id: check-toml
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      # No -i: shfmt takes the indent from .editorconfig.
      - id: shfmt
        args: [--write]
        stages: [pre-commit]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
